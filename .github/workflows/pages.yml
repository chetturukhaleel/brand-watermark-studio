name: Deploy Brand Watermark Studio to GitHub Pages
# Keep each deployment on a fresh workflow run; do not rerun a run that already uploaded artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # Give the Actions artifact service time to index the freshly uploaded Pages artifact.
      - name: Wait for Pages artifact indexing
        run: sleep 12
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
